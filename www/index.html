<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fluentia</title>
<style>
:root{--g:#2e9e44;--gd:#1f7a32;--gl:#d7f5dc;--bg:#fff;--card:#f1f5f1;--tx:#1b1b1b;--rl:#ffdad6;--r:#e53935;--bd:#d9e2d9;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--g:#4cc46a;--gd:#9be3ad;--gl:#1d3a23;--bg:#121512;--card:#1e241e;--tx:#eef2ee;--rl:#4a1f1b;--r:#ff8a80;--bd:#33403a;--on:#0d2012;color-scheme:dark}}
:root[data-theme="dark"]{--g:#4cc46a;--gd:#9be3ad;--gl:#1d3a23;--bg:#121512;--card:#1e241e;--tx:#eef2ee;--rl:#4a1f1b;--r:#ff8a80;--bd:#33403a;--on:#0d2012;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
#app{max-width:560px;margin:0 auto;padding:18px 18px 96px}
h1,h2,h3,p{margin:0}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px}
.hero{background:var(--g);color:var(--on);border-radius:24px;padding:20px;margin-bottom:14px}
.row{display:flex;gap:12px;align-items:center}
.grow{flex:1}
.stat{background:var(--gl);border-radius:18px;padding:14px;flex:1}
.stat b{display:block;font-size:26px;color:var(--gd)}
.stat span{font-size:13px;color:var(--gd)}
.menu{display:flex;gap:14px;align-items:center;width:100%;border:0;text-align:left;color:var(--tx);font:inherit;cursor:pointer}
.ico{width:46px;height:46px;border-radius:50%;background:var(--g);color:var(--on);display:grid;place-items:center;font-size:22px;flex:none}
.btn{background:var(--g);color:var(--on);border:0;border-radius:16px;padding:14px;font:inherit;font-weight:700;width:100%;cursor:pointer;font-size:16px}
.btn:disabled{opacity:.4}
.btn.alt{background:transparent;color:var(--g);border:2px solid var(--g)}
.opt{display:flex;gap:14px;width:100%;text-align:left;background:var(--card);color:var(--tx);border:2px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:10px;font:inherit;font-size:16px;cursor:pointer}
.opt b{color:var(--g)}
.opt.ok{background:var(--gl);border-color:var(--g)}
.opt.no{background:var(--rl);border-color:var(--r)}
.opt.sel{background:var(--gl);border-color:var(--g)}
.bar{height:10px;background:var(--gl);border-radius:6px;flex:1;overflow:hidden}
.bar i{display:block;height:100%;background:var(--g);transition:width .4s}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{border:2px solid var(--bd);background:transparent;color:var(--tx);border-radius:20px;padding:6px 14px;font:inherit;cursor:pointer}
.chip.on{background:var(--gl);border-color:var(--g);color:var(--gd);font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;max-width:560px;width:100%}
nav button{flex:1;background:none;border:0;padding:10px 0;color:var(--tx);opacity:.6;font:inherit;font-size:12px;cursor:pointer}
nav button.on{opacity:1;color:var(--g);font-weight:700}
nav button span{display:block;font-size:22px}
.tag{font-size:12px;font-weight:700;color:var(--g);letter-spacing:.05em;text-transform:uppercase}
.splash{position:fixed;inset:0;overflow:hidden;display:grid;place-content:center;text-align:center;color:#fff;background:radial-gradient(circle at 20% 15%,#5fd37a 0,transparent 45%),radial-gradient(circle at 85% 85%,#0f8a6a 0,transparent 50%),linear-gradient(160deg,#1f7a32,#0b4d3b);cursor:pointer}
.splash .in{position:relative;z-index:2;padding:24px}
.logo{position:relative;width:132px;height:132px;margin:0 auto 24px}
.logo svg{width:132px;height:132px;filter:drop-shadow(0 14px 24px rgba(0,0,0,.3));animation:bounce 1s cubic-bezier(.34,1.56,.64,1) both}
.ring{position:absolute;left:50%;top:50%;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;border:2px solid rgba(255,255,255,.55);animation:ring 2.4s ease-out infinite}
.by{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));font-size:12px;letter-spacing:.1em;opacity:.8;z-index:2;animation:rise .8s 1.3s both}
.splash h1{font-size:46px;letter-spacing:-1.5px;font-weight:800;animation:rise .8s .4s both}
.splash h1 span{color:#c9f7a8}
.tag2{font-size:16px;opacity:.92;max-width:300px;margin:6px auto 0;animation:rise .8s .7s both}
.pills{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:22px auto 0;max-width:320px;animation:rise .8s 1s both}
.pills i{font-style:normal;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:5px 12px;font-size:13px}
.load{width:160px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:30px auto 0;overflow:hidden}
.load b{display:block;height:100%;background:#fff;animation:fill 5.8s linear both}
.blob{position:absolute;border-radius:50%;background:rgba(255,255,255,.08);animation:float 7s ease-in-out infinite}
@keyframes bounce{from{transform:scale(0) rotate(-20deg)}to{transform:none}}
@keyframes ring{from{transform:scale(.8);opacity:.8}to{transform:scale(2.2);opacity:0}}
@keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@keyframes fill{from{width:0}to{width:100%}}
@keyframes float{50%{transform:translateY(-24px)}}
@media(prefers-reduced-motion:reduce){.splash *{animation:none!important}}
.hh{background:linear-gradient(150deg,#2e9e44,#0b4d3b);color:#fff;border-radius:28px;padding:20px;margin-bottom:16px;position:relative;overflow:hidden}
.hh:after{content:"";position:absolute;right:-40px;top:-50px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.1);pointer-events:none}
.hh h2{font-size:26px;letter-spacing:-.5px}
.mini{display:flex;gap:8px;margin-top:16px}
.mini div{flex:1;background:rgba(255,255,255,.16);border-radius:16px;padding:10px 4px;text-align:center}
.mini b{display:block;font-size:18px}
.mini small{font-size:11px;opacity:.9}
.feat{background:linear-gradient(135deg,#ff9800,#e65100);color:#fff;border-radius:24px;padding:20px;margin-bottom:18px;position:relative;overflow:hidden}
.feat:after{content:"🎓";position:absolute;right:10px;bottom:-14px;font-size:90px;opacity:.18}
.btn.w{background:#fff;color:#bf4300;margin-top:12px;width:auto;padding:10px 18px;position:relative;z-index:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.tile{border:0;border-radius:22px;padding:16px;text-align:left;color:#fff;font:inherit;cursor:pointer;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s}
.tile:active{transform:scale(.96)}
.tile .e{font-size:32px}
.tile b{display:block;font-size:17px}
.tile small{opacity:.92}
.owl.xs{width:36px;height:36px;cursor:default;animation:hop 1.4s ease-in-out infinite;animation-delay:calc(var(--i)*.25s)}
.cast{display:flex;gap:6px;justify-content:center;margin-top:18px;animation:rise .8s 1.2s both}
.tl{border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:8px 12px;margin:4px;font:inherit;font-size:16px;cursor:pointer}
.tl.ok{background:var(--gl);border-color:var(--g)}
.tl.no{background:var(--rl);border-color:var(--r)}
.zone{min-height:84px;border:2px dashed var(--bd);border-radius:16px;padding:6px;margin:12px 0;display:flex;flex-wrap:wrap;align-content:flex-start}
.owl.a-tilt{animation:tilt 1.4s ease-in-out}
.owl.a-hop{animation:hopj 1s cubic-bezier(.3,1.6,.5,1)}
.owl.a-wiggle{animation:wig .9s ease-in-out}
.owl.a-nod{animation:nod 1.2s ease-in-out}
.owl.a-peek{animation:peek 1.5s ease-in-out}
.owl.a-look .pu,.owl.a-peek .pu,.logo .pu{animation:look 1.8s ease-in-out infinite}
.owl.a-look .pu,.owl.a-peek .pu{animation-iteration-count:1}
.owl.a-flap .wL{animation:flapL .25s 5 alternate}
.owl.a-flap .wR{animation:flapR .25s 5 alternate}
@keyframes breathe{50%{transform:scale(1.025,.975)}}
@keyframes tilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-9deg)}65%{transform:rotate(7deg)}}
@keyframes hopj{0%{transform:scale(1.08,.9)}35%{transform:translateY(-16px) scale(.95,1.08)}60%{transform:translateY(0) scale(1.1,.88)}80%{transform:scale(.98,1.03)}100%{transform:none}}
@keyframes wig{0%,100%{transform:rotate(0)}15%{transform:rotate(-7deg)}35%{transform:rotate(7deg)}55%{transform:rotate(-5deg)}75%{transform:rotate(4deg)}}
@keyframes nod{0%,100%{transform:none}40%{transform:translateY(4px) scale(1.04,.94)}}
@keyframes peek{0%,100%{transform:none}30%{transform:translateX(-7px) rotate(-5deg)}70%{transform:translateX(7px) rotate(5deg)}}
@keyframes look{0%,100%{transform:translateX(0)}30%{transform:translateX(-4px)}70%{transform:translateX(4px)}}
.owlrow{display:flex;gap:10px;align-items:flex-end;margin-bottom:16px}
.owl{width:96px;height:96px;flex:none;cursor:pointer;transform-origin:50% 100%;animation:breathe 4s ease-in-out infinite}
.owl.sm{width:56px;height:56px}
.bub{position:relative;flex:1;background:var(--card);border:2px solid var(--bd);border-radius:18px;padding:12px 14px;font-size:15px;animation:rise .4s both}
.bub:before{content:"";position:absolute;left:-9px;bottom:22px;width:14px;height:14px;background:var(--card);border-left:2px solid var(--bd);border-bottom:2px solid var(--bd);transform:rotate(45deg)}
.bub small{display:block;opacity:.65;margin-top:4px;font-size:12px}
.lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:blink 4.2s infinite}
.m-sleepy .lid{animation:none;transform:scaleY(.6)}
.wL,.wR{transform-box:fill-box}
.wL{transform-origin:100% 10%}
.wR{transform-origin:0% 10%}
.m-wave .wR{animation:wave .6s ease-in-out infinite alternate}
.m-cheer .wR{animation:flapR .45s ease-in-out infinite alternate}
.m-cheer .wL{animation:flapL .45s ease-in-out infinite alternate}
.zz{animation:rise 1.6s infinite alternate}
@keyframes hop{50%{transform:translateY(-5px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
@keyframes wave{to{transform:rotate(-35deg)}}
@keyframes flapR{to{transform:rotate(-22deg)}}
@keyframes flapL{to{transform:rotate(22deg)}}
@media(prefers-reduced-motion:reduce){.owl,.owl *{animation:none!important}}
input{font:inherit;padding:10px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);width:100%}
.big{font-size:64px;font-weight:800;color:var(--g)}
svg{width:100%;height:auto;display:block}
</style>
</head>

idak beraturan; bentuk lampaunya ’went’."},{"p":"Simple Past","t":"They ___ not at home last night.","o":["was","were","are","is"],"a":1,"e":"Subjek ’they’ di masa lampau memakai ’were’."},{"p":"Simple Past","t":"___ you finish your homework?","o":["Do","Did","Are","Have"],"a":1,"e":"Pertanyaan Simple Past memakai ’Did’ + verb dasar."},{"p":"Simple Past","t":"He ___ his keys yesterday.","o":["lose","loses","lost","losing"],"a":2,"e":"Bentuk lampau dari ’lose’ adalah ’lost’."},{"p":"Simple Past","t":"We ___ pizza for dinner last night.","o":["eat","ate","eaten","eating"],"a":1,"e":"Bentuk lampau dari ’eat’ adalah ’ate’ (’eaten’ adalah past participle)."},{"p":"Simple Past","t":"Did she ___ the door?","o":["close","closed","closes","closing"],"a":0,"e":"Setelah ’Did’, verb kembali ke bentuk dasar: ’close’."},{"p":"Simple Past","t":"The film ___ at 9 p.m. yesterday.","o":["start","starts","started","starting"],"a":2,"e":"Kejadian selesai di masa lampau memakai verb bentuk kedua: ’started’."},{"p":"Present Continuous","t":"Look! The baby ___.","o":["sleeps","is sleeping","slept","sleep"],"a":1,"e":"’Look!’ menunjukkan kejadian yang sedang berlangsung: is + V-ing."},{"p":"Present Continuous","t":"I ___ a book right now.","o":["read","am reading","reads","was reading"],"a":1,"e":"’Right now’ menandakan Present Continuous: am + V-ing."},{"p":"Present Continuous","t":"They ___ TV at the moment.","o":["are watching","watches","watched","watch"],"a":0,"e":"’At the moment’ memakai are + V-ing untuk subjek ’they’."},{"p":"Present Continuous","t":"What ___ you doing now?","o":["are","do","is","did"],"a":0,"e":"Subjek ’you’ dengan V-ing memakai ’are’."},{"p":"Present Continuous","t":"She ___ not working today.","o":["am","is","are","do"],"a":1,"e":"Subjek ’she’ memakai ’is’: is not working."},{"p":"Present Continuous","t":"We ___ for the bus now.","o":["wait","waits","are waiting","waited"],"a":2,"e":"’Now’ menandakan sedang berlangsung: are waiting."},{"p":"Present Continuous","t":"Listen! Someone ___ at the door.","o":["knock","knocks","is knocking","knocked"],"a":2,"e":"’Listen!’ menandakan kejadian sedang terjadi: is knocking."},{"p":"Present Continuous","t":"___ he studying English?","o":["Is","Does","Are","Do"],"a":0,"e":"Pertanyaan Present Continuous dengan ’he’ diawali ’Is’."},{"p":"Present Perfect","t":"I ___ lived here since 2020.","o":["have","has","am","did"],"a":0,"e":"Present Perfect: have/has + V3. Subjek ’I’ memakai ’have’."},{"p":"Present Perfect","t":"She ___ already eaten lunch.","o":["have","has","is","did"],"a":1,"e":"Subjek ’she’ memakai ’has’ pada Present Perfect."},{"p":"Present Perfect","t":"They have ___ the work.","o":["finish","finished","finishing","finishes"],"a":1,"e":"Setelah have/has dipakai past participle: ’finished’."},{"p":"Present Perfect","t":"___ you ever been to Japan?","o":["Have","Has","Did","Do"],"a":0,"e":"Pengalaman hidup (’ever’) memakai Present Perfect; subjek ’you’ memakai ’Have’."},{"p":"Present Perfect","t":"He has worked here ___ five years.","o":["since","for","ago","during"],"a":1,"e":"’For’ dipakai untuk lamanya waktu (five years); ’since’ untuk titik waktu."},{"p":"Present Perfect","t":"We haven’t seen him ___ Monday.","o":["for","since","ago","in"],"a":1,"e":"’Since’ dipakai untuk titik awal waktu seperti ’Monday’."},{"p":"Present Perfect","t":"I have just ___ my homework.","o":["do","did","done","doing"],"a":2,"e":"Past participle dari ’do’ adalah ’done’."},{"p":"Present Perfect","t":"She ___ never visited London.","o":["have","has","is","was"],"a":1,"e":"Subjek ’she’ memakai ’has’ + past participle."},{"p":"Future Tense","t":"I ___ call you tomorrow.","o":["will","am","did","have"],"a":0,"e":"Janji atau keputusan spontan di masa depan memakai ’will’ + verb dasar."},{"p":"Future Tense","t":"I think it ___ rain this afternoon.","o":["will","is","did","has"],"a":0,"e":"Prediksi berdasarkan pendapat memakai ’will’."},{"p":"Future Tense","t":"She is going to ___ a doctor.","o":["is","be" function loadVoices(){try{voices=speechSynthesis.getVoices()}catch(e){}}

function say(text,onFail){
 const fail=r=>{if(onFail)onFail(r)};
 if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined'){fail('unsupported');return false}
 try{
  const ss=speechSynthesis;let started=false;
  ss.cancel();if(ss.resume)ss.resume();
  const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.9;
  const v=voices.find(x=>x.lang==='en-US')||voices.find(x=>/^en/i.test(x.lang));if(v)u.voice=v;
  u.onstart=()=>{started=true};
  u.onerror=e=>{if(!started)fail(e&&e.error||'error')};
  setTimeout(()=>{try{ss.speak(u)}catch(e){fail('error')}},60);
  setTimeout(()=>{if(!started&&!ss.speaking)fail('silent')},2000);
  return true
 }catch(e){fail('error');return false}
}

 else{

function dailyWords(){const d=new Date(),r=mulberry(d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()),a=D.v.map((_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,10).map(i=>D.v[i])}
let wod=store.get('wod',{day:'',i:0});

function wodNext(){const s=wodState();s.i=(s.i+1)%10;store.set('wod',s);render()}

 <div class="owlrow">${owlSVG(o[0])}<div class="bub"><small style="margin:0 0 2px">${curOwl().n} · ${curOwl().r}</small>${o[1]}<small>Ketuk aku untuk ganti teman belajar</small></div></div>
 <div class="feat"><p class="tag" style="color:#fff;opacity:.9">Seperti TOEFL asli</p><h2 style="font-size:22px;margin:4px 0">🎓 Simulasi TOEFL</h2><p style="opacity:.95">3 bagian bertimer, estimasi skor 310–677 di akhir.</p><button class="btn w" onclick="go('simmenu')">Mulai Simulasi →</button></div>

 app.innerHTML=view==='home'?home():view==='vocab'?vocab():view==='progress'?progress():view==='guide'?guideView():view==='rk'?rkView():view==='simmenu'?simMenu():view==='sim'?simView():quizView();
 nav.hidden=view==='quiz'||view==='sim'||view==='rk';

const SIMCFG={full:{L:[50,35],S:[40,25],R:[50,55]},mini:{L:[10,8],S:[10,7],R:[8,8]}};
let sim=null,tick=null;
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function simMenu(){return `<h2>🎓 Simulasi TOEFL</h2><p style="margin:8px 0 14px">Ujian bertimer 3 bagian seperti TOEFL ITP: Listening, Structure &amp; Written Expression, dan Reading. Selama ujian tidak ada jawaban benar/salah; skor muncul di akhir.</p>`+[['full','Simulasi Penuh','50 Listening (35 mnt) • 40 Structure (25 mnt) • 50 Reading (55 mnt)'],['mini','Simulasi Mini','10 Listening (8 mnt) • 10 Structure (7 mnt) • 8 Reading (8 mnt)']].map(x=>`<div class="card"><button class="menu" style="background:none;padding:0" onclick="simStart('${x[0]}')"><span class="ico">⏱</span><span><b>${x[1]}</b><br><small>${x[2]}</small></span></button></div>`).join('')+`<p style="font-size:13px;opacity:.8;margin:6px 0 14px">Catatan: skor adalah estimasi pada skala TOEFL ITP (310–677) dengan rumus linear, bukan skor resmi ETS.</p><button class="chip" onclick="go('home')">← Kembali</button>`}
function simStart(mode){const c=SIMCFG[mode],pk=(a,n)=>sh(a).slice(0,n).map(prep);
 const secs=[{n:'Listening Comprehension',qs:pk(D.l,c.L[0]),min:c.L[1],max:68},{n:'Structure & Written Expression',qs:pk(D.g,c.S[0]),min:c.S[1],max:68},{n:'Reading Comprehension',qs:D.r.slice(0,c.R[0]).map(prep),min:c.R[1],max:67}];
 sim={mode,sec:0,i:0,phase:'intro',secs:secs.map(s=>({...s,ans:s.qs.map(()=>null),played:{}}))};clearInterval(tick);go('sim')}
function simBegin(){const s=sim.secs[sim.sec];sim.phase='run';sim.i=0;sim.end=Date.now()+s.min*60000;clearInterval(tick);tick=setInterval(()=>{const left=Math.max(0,Math.round((sim.end-Date.now())/1000)),el=$('#tm');if(el)el.textContent=fmt(left);if(left<=0)simFinish()},500);render();window.scrollTo(0,0)}
function simPick(i){sim.secs[sim.sec].ans[sim.i]=i;render()}
function simNext(){const s=sim.secs[sim.sec];if(sim.i+1>=s.qs.length)simFinish();else{sim.i++;render();window.scrollTo(0,0)}}
function simPrev(){if(sim.i>0){sim.i--;render();window.scrollTo(0,0)}}
function simSpeak(){const s=sim.secs[sim.sec];if(s.played[sim.i])return;s.played[sim.i]=1;say(s.qs[sim.i].au,()=>{delete s.played[sim.i];showScript=true;render()});render()}
function simExit(){clearInterval(tick);try{speechSynthesis.cancel()}catch(e){}sim=null;go('home')}
function simScore(){const r=sim.secs.map(s=>{const k=s.ans.filter((a,i)=>a===s.qs[i].a).length;return{k,n:s.qs.length,sc:Math.round(31+(s.max-31)*k/s.qs.length)}});const total=Math.round((r[0].sc+r[1].sc+r[2].sc)*10/3);return{r,total}}
function simFinish(){clearInterval(tick);try{speechSynthesis.cancel()}catch(e){}
 if(sim.sec+1<3){sim.sec++;sim.phase='intro'}else{sim.phase='result';sim.quote=pk(QUOTES);const x=simScore();results.unshift({c:'Simulasi TOEFL',t:x.r.reduce((a,b)=>a+b.n,0),k:x.r.reduce((a,b)=>a+b.k,0),ts:Date.now(),s:x.total});store.set('results',results)}
 render();window.scrollTo(0,0)}
const lvl=t=>t>=627?'C1 (Advanced)':t>=543?'B2 (Upper-Intermediate)':t>=460?'B1 (Intermediate)':t>=337?'A2 (Elementary)':'di bawah A2';
function simView(){

 if(sim.phase==='run'){const q=s.qs[sim.i],a=s.ans[sim.i],left=Math.max(0,Math.round((sim.end-Date.now())/1000)),un=s.ans.filter(x=>x===null).length;
  return `<div class="row" style="margin-bottom:12px"><button class="chip" onclick="simExit()" aria-label="Keluar">✕</button><div class="grow"><p class="tag">${s.n}</p><small>Soal ${sim.i+1}/${s.qs.length}</small></div><b id="tm" style="font-size:20px;font-variant-numeric:tabular-nums">${fmt(left)}</b></div><div class="bar" style="margin-bottom:14px"><i style="width:${(sim.i+1)*100/s.qs.length}%"></i></div>${q.ps?`<div class="card">${q.ps}</div>`:''}${q.au?`<button class="btn" style="margin-bottom:10px" ${s.played[sim.i]?'disabled':''} onclick="simSpeak()">${s.played[sim.i]?'Audio sudah diputar':'▶ Putar Audio (1x)'}</button>${showScript?`<div class="card"><small>Suara tidak tersedia di perangkat ini. Teks audio:</small><br>${q.au}</div>`:''}`:''}<h2 style="margin:6px 0 14px;font-size:20px">${q.t}</h2>`+q.o.map((o,i)=>`<button class="opt ${a===i?'sel':''}" onclick="simPick(${i})"><b>${'ABCD'[i]}</b><span>${o}</span></button>`).join('')+`<div class="row" style="margin-top:8px">${sim.sec>0&&sim.i>0?`<button class="btn alt" onclick="simPrev()">← Sebelumnya</button>`:''}<button class="btn" onclick="simNext()">${sim.i+1===s.qs.length?'Selesai Bagian':'Berikutnya →'}</button></div>${sim.i+1===s.qs.length&&un?`<p style="margin-top:10px;font-size:13px">Masih ada ${un} soal belum dijawab.</p>`:''}`}
 const x=simScore(),names=['Listening','Structure','Reading'];
 return `${owlBox(x.total>=543?'cheer':'happy',x.total>=543?'Skor yang bagus! Pertahankan dan coba naikkan lagi 🎉':'Ini baru awal. Cek pembahasan di bawah, lalu ulangi simulasinya!')}<div style="text-align:center;padding-top:6px"><p class="tag">Hasil Simulasi TOEFL</p><div class="big">${x.total}</div><p><b>Estimasi skor TOEFL ITP (310–677)</b></p><p style="margin-top:6px">Perkiraan level CEFR: <b>${lvl(x.total)}</b></p></div><div style="margin:18px 0">`+x.r.map((r,i)=>`<div class="card row"><div class="grow"><b>${names[i]}</b><br><small>${r.k}/${r.n} benar</small></div><b style="font-size:22px;color:var(--g)">${r.sc}</b></div>`).join('')+`</div><p style="font-size:13px;opacity:.8;margin-bottom:14px">Estimasi dari rumus linear (Listening dan Structure 31–68, Reading 31–67), bukan skor resmi ETS.</p>`+sim.secs.map((s,si)=>{const w=s.qs.map((q,i)=>[q,s.ans[i]]).filter(([q,a])=>a!==q.a);return w.length?`<details class="card"><summary><b>Pembahasan ${names[si]}</b> (${w.length} salah/kosong)</summary>${w.map(([q,a])=>`<p style="margin-top:10px"><b>${q.t}</b><br>Jawabanmu: ${a===null?'(kosong)':q.o[a]}<br>Benar: <b>${q.o[q.a]}</b><br><small>${q.e}</small></p>`).join('')}</details>`:''}).join('')+`${quoteCard(sim.quote)}<button class="btn" onclick="simStart('${sim.mode}')">Ulangi Simulasi</button><br><br><button class="btn alt" onclick="simExit()">Kembali ke Beranda</button>`;

const GUIDE=`Simple Present|Kebiasaan dan fakta umum|(+) S + V1 (he/she/it: V1 + s/es); (−) S + do/does not + V1; (?) Do/Does + S + V1?|She goes to school every day.; Water boils at 100°C.; Does he work here?|every day, always, usually, often, never
Simple Past|Kejadian yang selesai di masa lampau|(+) S + V2; (−) S + did not + V1; (?) Did + S + V1?|I watched a movie yesterday.; She did not go to the party.; Did you finish the report?|yesterday, last week, two days ago, in 2010
Simple Future|Rencana, janji, dan prediksi|(+) S + will + V1; (−) S + will not + V1; Be going to: S + am/is/are + going to + V1|I will call you tomorrow.; Look at the clouds! It is going to rain.|tomorrow, next week, soon, tonight
Present Continuous|Sedang terjadi sekarang atau rencana dekat|S + am/is/are + V-ing; (−) S + am/is/are not + V-ing; (?) Am/Is/Are + S + V-ing?|They are studying now.; I am meeting him tonight.|now, right now, at the moment, Look!, Listen!
Past Continuous|Sedang berlangsung pada waktu tertentu di masa lampau|S + was/were + V-ing|She was reading when I called.; We were sleeping at ten last night.|while, when, at that time
Present Perfect|Pengalaman atau hasil yang terkait dengan sekarang|S + have/has + V3; (−) S + have/has not + V3; (?) Have/Has + S + V3?|I have lived here since 2020.; Have you ever been to Japan?; She has just left.|since, for, already, yet, ever, never, just
Past Perfect|Kejadian yang terjadi lebih dulu dari kejadian lampau lain|S + had + V3|She had left before I arrived.; They had finished when the bell rang.|before, after, by the time
Passive Voice|Fokus pada penerima aksi, bukan pelaku|S + be + V3 (+ by pelaku). Present: is/are + V3. Past: was/were + V3. Future: will be + V3|The cake was made by my mother.; English is spoken all over the world.; The report will be finished tomorrow.|by ..., dipakai saat pelaku tidak penting
Conditional (If)|Pengandaian|Zero: If + present, present. Type 1: If + present, will + V1. Type 2: If + past, would + V1. Type 3: If + had + V3, would have + V3|If you heat ice, it melts.; If it rains, we will stay home.; If I were rich, I would travel.; If I had known, I would have told you.|if, unless
Modal Verbs|Kemampuan, izin, saran, dan keharusan|S + modal + V1 (can, could, may, might, must, should, would)|She can swim.; You should see a doctor.; May I borrow your pen?|can = bisa, must = harus, should = sebaiknya, may = boleh
Comparison|Perbandingan kata sifat|Comparative: adj-er / more + adj + than. Superlative: the + adj-est / the most + adj. Sama: as + adj + as|She is taller than me.; This is the most interesting book.; He runs as fast as a horse.|than, as ... as, the -est
Articles|a / an / the|a + bunyi konsonan. an + bunyi vokal. the + benda spesifik atau unik|I have an apple.; He is a teacher.; The moon is bright.|an hour, an honest man, a university
Quantifiers|Ungkapan jumlah|Terhitung: many, few, a few. Tak terhitung: much, little, a little. Keduanya: some, any, a lot of|How many students are there?; How much sugar do you need?; There isn't any milk.|some untuk kalimat positif, any untuk negatif dan tanya
Preposition of Time and Place|in / on / at|in + bulan, tahun, musim. on + hari dan tanggal. at + jam dan titik tertentu|in 2001, in December; on Monday, on May 5; at 7 o'clock, at the station|—
Subject-Verb Agreement|Subjek dan verb harus cocok (sering keluar di TOEFL)|Subjek tunggal + V-s. Subjek jamak + V1. each / every / everyone + verb tunggal|Each of the students has a book.; The books are on the table.; Everyone is ready.|each, every, none of, the number of
Parallel Structure|Bentuk kata dalam daftar harus sejajar (TOEFL)|A, B, and C harus berbentuk sama: semuanya V-ing, atau semuanya noun, atau semuanya V1|She likes reading, writing, and swimming.; He is smart, kind, and honest.|and, or, but, not only ... but also
Gerund and Infinitive|Bentuk verb setelah verb lain|enjoy / avoid / finish / mind + V-ing. want / decide / hope / plan + to + V1|He enjoys singing.; She wants to leave.; They decided to move.|—
Relative Clauses|who / which / that / whose|Orang: who. Benda: which. Orang atau benda: that. Kepemilikan: whose|The man who called is my uncle.; The book that I read was good.; The girl whose bag was lost is crying.|—
Reported Speech|Kalimat tidak langsung|Tense mundur satu langkah: am/is menjadi was, will menjadi would, V1 menjadi V2|She said that she was tired.; He told me that he would come.|said that, told me that, asked if`.split('\n').map(l=>{const p=l.split('|');return{t:p[0],u:p[1],f:p[2].split(';'),e:p[3].split(';'),m:p[4]}});
function guideView(){return `<div class="row" style="margin-bottom:10px"><button class="chip" onclick="go('home')" aria-label="Kembali">←</button><h2>📐 Rumus Grammar</h2></div><p style="margin-bottom:12px;font-size:14px">Ketuk topik untuk melihat rumus, contoh, dan penandanya.</p>`+GUIDE.map(g=>`<details class="card"><summary><b>${g.t}</b><br><small>${g.u}</small></summary><p class="tag" style="margin-top:10px">Rumus</p>${g.f.map(x=>`<p style="font-family:ui-monospace,monospace;font-size:14px;background:var(--bg);border-radius:10px;padding:6px 10px;margin-top:6px">${x.trim()}</p>`).join('')}<p class="tag" style="margin-top:10px">Contoh</p>${g.e.map(x=>`<p style="font-style:italic;margin-top:4px">• ${x.trim()}</p>`).join('')}${g.m&&g.m!=='—'?`<p class="tag" style="margin-top:10px">Penanda</p><p>${g.m}</p>`:''}</details>`).join('')}
const RKS=`She goes to the library every day.
They have never visited the museum.
The professor will give a lecture tomorrow.
We are studying for the exam now.
He was reading when I called him.
The report was written by the students.
If it rains, we will stay at home.
I have lived in Jakarta since 2020.
Scientists discovered a new species last year.
My brother is taller than my father.
She can speak three languages fluently.
You should drink more water every day.
The book that I borrowed was very interesting.
Did you finish your homework yesterday?
Where do you usually eat lunch?
What time does the train leave?
He enjoys playing football after school.
They decided to move to a bigger house.
The meeting starts at nine o'clock.
There are many students in the classroom.
Each of the students has a laptop.
She has waited for two hours.
We were having dinner at eight last night.
The window was broken by the wind.
Please listen to the teacher carefully.
My mother cooks delicious food every morning.
I will help you with your project.
The children are playing in the garden.
He has just finished his presentation.
The weather is colder than yesterday.
Reading books improves your vocabulary.
She asked me where I lived.
We must finish this task before Friday.
The university offers many scholarships.
Researchers are collecting data from the survey.
It is important to sleep well before the test.
He did not understand the question.
Have you ever traveled abroad?
Many people use phones to learn languages.
The students will take the exam next week.`.split('\n');
let rk=null;
function rkStart(){const qs=sh(RKS).slice(0,10).map(s=>{const w=s.split(' ');let tiles=sh(w.map((x,i)=>({id:i,w:i===0&&x!=='I'?x[0].toLowerCase()+x.slice(1):x})));if(w.length>2&&tiles.every((t,i)=>t.id===i))tiles.reverse();return{s,tiles,ans:[]}});rk={qs,i:0,checked:false,ok:false,k:0,done:false};go('rk')}
function rkTap(id){if(rk.checked)return;const q=rk.qs[rk.i];q.ans=q.ans.includes(id)?q.ans.filter(x=>x!==id):[...q.ans,id];render()}
function rkClear(){if(rk.checked)return;rk.qs[rk.i].ans=[];render()}
function rkCheck(){const q=rk.qs[rk.i];if(rk.checked||q.ans.length!==q.tiles.length)return;const built=q.ans.map(id=>q.tiles.find(t=>t.id===id).w).join(' ');q.ok=built.toLowerCase()===q.s.toLowerCase();if(q.ok)rk.k++;rk.checked=true;render()}
function rkNext(){if(!rk.checked)return;if(rk.i+1>=rk.qs.length){rk.done=true;rk.quote=pk(QUOTES);results.unshift({c:'Rangkai Kata',t:rk.qs.length,k:rk.k,ts:Date.now()});store.set('results',results)}else{rk.i++;rk.checked=false}render();window.scrollTo(0,0)}
function rkView(){const n=rk.qs.length;
 if(rk.done){const p=Math.round(rk.k*100/n);return `${owlBox(p>=80?'cheer':'happy',p>=80?'Kalimatmu rapi sekali! Hebat 🌟':'Terus berlatih, urutan kata makin lama makin terasa natural 💪')}<div style="text-align:center"><h2>Hasil Rangkai Kata</h2><div class="big">${p}%</div><p><b>Skor: ${rk.k} / ${n} benar</b></p></div>${quoteCard(rk.quote)}<button class="btn" onclick="rkStart()">Ulangi Latihan</button><br><br><button class="btn alt" onclick="go('home')">Kembali ke Beranda</button>`}
 const q=rk.qs[rk.i],ch=rk.checked,get=id=>q.tiles.find(t=>t.id===id);
 return `<div class="row" style="margin-bottom:16px"><button class="chip" onclick="go('home')" aria-label="Tutup">✕</button><div class="bar"><i style="width:${(rk.i+(ch?1:0))*100/n}%"></i></div><b>${rk.i+1}/${n}</b></div><p class="tag">Rangkai Kata</p><h2 style="margin:6px 0;font-size:20px">Susun kata menjadi kalimat yang benar</h2>
 <div class="zone">${q.ans.map(id=>`<button class="tl ${ch?(q.ok?'ok':'no'):''}" onclick="rkTap(${id})">${get(id).w}</button>`).join('')||'<small style="padding:12px;opacity:.6">Ketuk kata di bawah untuk menyusun kalimat</small>'}</div>
 <div style="margin-bottom:12px">${q.tiles.filter(t=>!q.ans.includes(t.id)).map(t=>`<button class="tl" onclick="rkTap(${t.id})">${t.w}</button>`).join('')}</div>
 ${ch?`${owlBox(q.ok?'cheer':'happy',q.ok?pk(PRAISE):'Belum tepat. Kalimat yang benar:<br><b>'+q.s+'</b>','sm',(owlN+rk.i)%5)}<button class="btn" onclick="rkNext()">${rk.i+1===n?'Lihat Hasil':'Next Question'}</button>`:`<div class="row"><button class="btn alt" onclick="rkClear()">Hapus</button><button class="btn" ${q.ans.length===q.tiles.length?'':'disabled'} onclick="rkCheck()">Cek Jawaban</button></div>`}`}
const ACTS={cheer:['hop','wiggle','tilt','look','flap'],sleepy:['nod','tilt'],def:['tilt','look','hop','nod','wiggle','flap','peek']};
setInterval(()=>{if(!document.querySelectorAll)return;document.querySelectorAll('.owl').forEach(el=>{if(Math.random()<.5)return;const m=((el.getAttribute('class')||'').match(/m-(\w+)/)||[])[1],pool=ACTS[m]||ACTS.def,a='a-'+pk(pool);pool.forEach(x=>el.classList.remove('a-'+x));el.classList.add(a);setTimeout(()=>el.classList.remove(a),1600)})},1800);
render();setTimeout(()=>{if(view==='splash')go('home')},6200);
</script>
